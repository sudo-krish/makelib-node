name: CI Pipeline

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-policy:
    name: Shift-Left Branch Policy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Branch Naming Standard
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          echo "Evaluating branch name: ${BRANCH_NAME}"
          bash scripts/check-branch.sh "${BRANCH_NAME}"

  quality-gates:
    name: 8-Stage Quality Gate Pipeline
    needs: branch-policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python for detect-secrets
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: |
          python -m pip install --upgrade pip
          pip install detect-secrets

      - name: Install Dependencies
        run: npm ci

      - name: Verify Code Formatting
        run: make format-check

      - name: Execute 8-Stage Quality Gate Pipeline
        run: make check-all
        env:
          MIN_COVERAGE: 80

      - name: Compile Production Bundle
        run: make build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 7

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
