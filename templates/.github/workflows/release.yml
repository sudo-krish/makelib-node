name: Release Pipeline

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      override_level:
        description: 'Manual release level override'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: read
  id-token: write

jobs:
  release:
    name: Build, Version, and Release
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python for detect-secrets
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: |
          python -m pip install --upgrade pip
          pip install detect-secrets

      - name: Install Dependencies
        run: npm ci

      - name: Run 8-Stage Quality Gate Pipeline
        run: make check-all
        env:
          MIN_COVERAGE: 80

      - name: Compile Production Bundle
        run: make build

      - name: Determine SemVer Bump Level
        id: semver
        run: |
          MANUAL_OVERRIDE="${{ github.event.inputs.override_level || 'auto' }}"
          if [ "$MANUAL_OVERRIDE" != "auto" ]; then
            echo "level=$MANUAL_OVERRIDE" >> $GITHUB_OUTPUT
            echo "Selected manual override: $MANUAL_OVERRIDE"
          else
            SOURCE_BRANCH="${{ github.event.pull_request.head.ref || '' }}"
            if [ -n "$SOURCE_BRANCH" ]; then
              BUMP_LEVEL=$(bash scripts/semver-release.sh --level --branch "$SOURCE_BRANCH")
            else
              BUMP_LEVEL=$(bash scripts/semver-release.sh --level)
            fi
            echo "level=$BUMP_LEVEL" >> $GITHUB_OUTPUT
            echo "Determined SemVer bump level from branch: $BUMP_LEVEL"
          fi

      - name: Bump Package Version
        id: bump
        run: |
          BUMP_LEVEL="${{ steps.semver.outputs.level }}"
          echo "Applying version bump: $BUMP_LEVEL"
          npm version "$BUMP_LEVEL" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New Version: v$NEW_VERSION"

      - name: Commit & Tag Release
        run: |
          NEW_VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push origin main --follow-tags

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.bump.outputs.version }}"
          gh release create "v${NEW_VERSION}" dist/* \
            --title "Release v${NEW_VERSION}" \
            --generate-notes

      - name: Publish to NPM (if NPM_TOKEN configured)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
            npm publish --access public
            echo "Package successfully published to npm registry."
          else
            echo "NPM_TOKEN not set; skipping npm registry publish."
          fi
