# ==============================================================================
# lefthook.yml — Shift-Left Git Hook Pipeline
# ==============================================================================

pre-commit:
  parallel: false
  commands:
    01-check-branch:
      run: bash scripts/check-branch.sh
    02-format:
      run: make format-check
    03-lint:
      run: make lint
    04-type-check:
      run: make type-check

commit-msg:
  commands:
    check-branch:
      run: bash scripts/check-branch.sh
